<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}JobShield AI — Fake Job Detector{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
{% block head %}{% endblock %}
</head>
<body>
<div id="routeProgress" class="route-progress"></div>
<header class="topnav">
  <div class="brand">
    <div class="brand-icon">🛡️</div>
    <h1>JobShield <span>AI</span></h1>
  </div>
  <nav class="nav">
    <a href="{{ url_for('index') }}" class="nav-link {{ 'active' if request.endpoint == 'index' }}"><span class="nav-icon">🏠</span> Home</a>
    <a href="{{ url_for('history_page') }}" class="nav-link {{ 'active' if request.endpoint == 'history_page' }}"><span class="nav-icon">🕘</span> History</a>
    <a href="{{ url_for('statistics_page') }}" class="nav-link {{ 'active' if request.endpoint == 'statistics_page' }}"><span class="nav-icon">📊</span> Statistics</a>
    <a href="{{ url_for('about_page') }}" class="nav-link {{ 'active' if request.endpoint == 'about_page' }}"><span class="nav-icon">ℹ️</span> About</a>
    <a href="{{ url_for('how_it_works_page') }}" class="nav-link {{ 'active' if request.endpoint == 'how_it_works_page' }}"><span class="nav-icon">⚙️</span> How It Works</a>
    <a href="{{ url_for('contact_page') }}" class="nav-link {{ 'active' if request.endpoint == 'contact_page' }}"><span class="nav-icon">✉️</span> Contact</a>
  </nav>
</header>
<main class="content">
  <div id="pageContent">{% block content %}{% endblock %}</div>
  <footer class="footer">
    <span>© 2026 JobShield AI</span>
    <span class="text-blue">Built by Syed Nishath</span>
  </footer>
</main>
<div class="toast-stack" id="toastStack"></div>
<script>
function showToast(message, type) {
  const stack = document.getElementById('toastStack');
  if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = message;
  stack.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-6px)';
    setTimeout(() => el.remove(), 300);
  }, 4000);
}
</script>
<div id="pageScripts">{% block scripts %}{% endblock %}</div>
<script>
// Lightweight same-origin router: swaps #pageContent instead of doing a
// full document navigation, so the sidebar never flashes/reloads between
// pages. Falls back to a real navigation on any failure - every route is
// still a complete, independently-loadable page for direct links/refresh.
(function () {
  var contentEl = document.getElementById('pageContent');
  var scriptsEl = document.getElementById('pageScripts');
  var bar = document.getElementById('routeProgress');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function isRoutableLink(link) {
    if (!link || !link.href) return false;
    if (link.target === '_blank' || link.hasAttribute('download')) return false;
    var raw = link.getAttribute('href') || '';
    if (raw.startsWith('#') || raw.startsWith('mailto:') || raw.startsWith('tel:')) return false;
    var url;
    try { url = new URL(link.href, window.location.href); } catch (e) { return false; }
    return url.origin === window.location.origin;
  }

  function startBar() {
    bar.style.transition = 'none';
    bar.style.opacity = '1';
    bar.style.width = '0%';
    // force reflow so the next transition actually animates from 0%
    void bar.offsetWidth;
    bar.style.transition = 'width 0.5s ease';
    bar.style.width = '72%';
  }

  function finishBar() {
    bar.style.transition = 'width 0.2s ease';
    bar.style.width = '100%';
    setTimeout(function () {
      bar.style.transition = 'opacity 0.25s ease';
      bar.style.opacity = '0';
    }, 150);
  }

  function updateActiveNav() {
    var links = document.querySelectorAll('.nav-link');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var path = new URL(a.href, window.location.href).pathname;
      a.classList.toggle('active', path === window.location.pathname);
    }
  }

  var loadedExternalScripts = {};

  function runScripts(container) {
    var scripts = Array.prototype.slice.call(container.querySelectorAll('script'));
    var chain = Promise.resolve();
    scripts.forEach(function (old) {
      chain = chain.then(function () {
        return new Promise(function (resolve) {
          if (old.src) {
            var absSrc = old.src;
            if (loadedExternalScripts[absSrc]) {
              resolve();
              return;
            }
            loadedExternalScripts[absSrc] = true;
            var s = document.createElement('script');
            s.src = absSrc;
            s.onload = resolve;
            s.onerror = resolve;
            document.body.appendChild(s);
          } else {
            var inline = document.createElement('script');
            inline.textContent = old.textContent;
            document.body.appendChild(inline);
            resolve();
          }
        });
      });
    });
    return chain;
  }

  function navigate(url, push) {
    startBar();
    fetch(url, { headers: { 'X-Requested-With': 'router' } })
      .then(function (res) {
        if (!res.ok) throw new Error('navigation failed');
        return res.text();
      })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var newContent = doc.getElementById('pageContent');
        var newScripts = doc.getElementById('pageScripts');
        if (!newContent) throw new Error('no #pageContent in response');

        var swap = function () {
          document.title = doc.title;
          contentEl.innerHTML = newContent.innerHTML;
          contentEl.style.opacity = '1';
          scriptsEl.innerHTML = '';
          if (newScripts) scriptsEl.innerHTML = newScripts.innerHTML;
          window.scrollTo(0, 0);
          if (push) window.history.pushState({ url: url }, '', url);
          updateActiveNav();
          finishBar();
          return runScripts(scriptsEl);
        };

        if (reduceMotion) {
          return swap();
        }
        contentEl.style.transition = 'opacity 0.15s ease';
        contentEl.style.opacity = '0';
        return new Promise(function (resolve) { setTimeout(resolve, 150); }).then(swap);
      })
      .catch(function () {
        window.location.href = url;
      });
  }

  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var link = e.target.closest('a');
    if (!isRoutableLink(link)) return;
    var dest = new URL(link.href, window.location.href);
    if (dest.pathname === window.location.pathname && dest.search === window.location.search) {
      e.preventDefault();
      return;
    }
    e.preventDefault();
    navigate(link.href, true);
  });

  window.addEventListener('popstate', function () {
    navigate(window.location.href, false);
  });

  updateActiveNav();
})();
</script>
</body>
</html>
